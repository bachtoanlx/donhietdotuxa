<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="https://icons.iconarchive.com/icons/bokehlicia/captiva/48/cloud-icon.png">

    <title>Weather measuring Tool</title>
    <script src="https://apis.google.com/js/api.js"></script>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://st.quantrimang.com/photos/image/2019/10/30/hinh-nen-phong-canh-dep-3.jpg') no-repeat center center fixed; /* Thay thế 'your-image-url.jpg' bằng URL của ảnh nền */
            background-size: cover;
            filter: blur(1px); /* Làm mờ ảnh nền */
            z-index: -1; /* Đặt ảnh nền ở phía sau nội dung */
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 70%;
            z-index: 1;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            opacity: 0.8; /* Đặt độ mờ cho bảng */
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        th:nth-child(1), td:nth-child(1) {
            width: 300px; /* Đặt chiều rộng cho cột A7 */
        }
        th:nth-child(2), td:nth-child(2) {
            width: 300px; /* Đặt chiều rộng cho cột B7 */
        }
    </style>
    <script>
let currentValues = {}; // Biến lưu giá trị hiện tại của các ô

function initClient() {
    gapi.client.init({
        'apiKey': 'AIzaSyANdbEb_R9E-tXldeDDoMTRfFX54NECou4',
        'discoveryDocs': ["https://sheets.googleapis.com/$discovery/rest?version=v4"],
    }).then(() => {
        checkForUpdates(); // Kiểm tra cập nhật khi khởi tạo xong
    });
}

function handleClientLoad() {
    gapi.load('client', initClient);
}

// Hàm đọc dữ liệu từ ô cụ thể trong Google Sheets
function readCell(cellRange, elementId) {
    const params = {
        spreadsheetId: '1DS0UweAQC4GMUbH7y9HuX5wlx_mKxrDTBCWDGs7cN4Y',
        range: `Sheet2!${cellRange}`,
    };

    gapi.client.sheets.spreadsheets.values.get(params).then((response) => {
        const value = response.result.values ? response.result.values[0][0] : 'Không có dữ liệu';

        // Kiểm tra nếu dữ liệu đã thay đổi thì mới cập nhật giao diện
        if (currentValues[cellRange] !== value) {
            document.getElementById(elementId).innerText = value;
            currentValues[cellRange] = value; // Cập nhật giá trị mới
        }
    }, (reason) => {
        console.error('Lỗi: ' + reason.result.error.message);
    });
}

// Hàm kiểm tra và cập nhật định kỳ
function checkForUpdates() {
    setInterval(() => {
        readCell('I9', 'cellI9');  // Lấy thời gian
        readCell('A7', 'cellA7');  // Lấy nhiệt độ
        readCell('B7', 'cellB7');  // Lấy độ ẩm
        readCell('D10', 'cellD10'); // Lấy Min day
        readCell('E10', 'cellE10'); // Lấy Max day
    }, 5000); // Kiểm tra mỗi 5 giây
}
</script>

    
    
</head>
<body onload="handleClientLoad()">
    <div class="background"></div>
    <div class="container">
        <table>
            <thead>
                <tr>
                    <th colspan="2">NHIỆT ẨM KẾ ONLINE</th>
                </tr>
                <tr>
                    <th>Thời gian:</th>
                    <td id="cellI9">Loading...</td>
                </tr>
                <tr>
                    <th>Nhiệt độ (℃)</th>
                    <th>Độ ẩm (%)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td id="cellA7">Loading...</td>
                    <td id="cellB7">Loading...</td>
                </tr>
                <tr>
                    <th>Min day (℃)</th>
                    <th>Max day (℃)</th>
                </tr>
                <tr>
                    <td id="cellD10">Loading...</td>
                    <td id="cellE10">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
