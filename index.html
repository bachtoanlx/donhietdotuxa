<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dữ liệu thời tiết</title>
    
    <style>
        .weather-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: -1;
        }

        .container {
            margin: 100px auto; /* Canh giữa màn hình */
            left: 0;
            top: 100px;
            width: 80%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.85);
            padding: 5px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.5s;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        th {
            background: #007bff;
            color: white;
        }

        .hidden {
            transform: translateX(-200%);
        }

        .toggle-btn {
            position: fixed;
            right: 10px;
            top: 100px;
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 10px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 20px;
            z-index: 10;
        }
    </style>
    <!-- Nạp API Google Sheets -->
    <script src="https://apis.google.com/js/api.js"></script>
    <script>
        let currentData = {}; // Lưu trữ giá trị hiện tại

        function initClient() {
            gapi.client.init({
                'apiKey': 'AIzaSyANdbEb_R9E-tXldeDDoMTRfFX54NECou4',
                'discoveryDocs': ["https://sheets.googleapis.com/$discovery/rest?version=v4"],
            }).then(() => {
                checkForUpdates(); // Bắt đầu kiểm tra dữ liệu
            });
        }

        function handleClientLoad() {
            gapi.load('client', initClient);
        }

        function readCell(cellId, cellRange) {
            const params = {
                spreadsheetId: '1DS0UweAQC4GMUbH7y9HuX5wlx_mKxrDTBCWDGs7cN4Y',
                range: `Sheet2!${cellRange}`
            };

            gapi.client.sheets.spreadsheets.values.get(params).then((response) => {
                const value = response.result.values ? response.result.values[0][0] : "N/A";
                if (value !== currentData[cellId]) {
                    document.getElementById(cellId).innerText = value;
                    currentData[cellId] = value;
                }
            }, (error) => {
                console.error(`Lỗi khi lấy dữ liệu ô ${cellRange}:`, error.result.error.message);
            });
        }

        function checkForUpdates() {
            setInterval(() => {
                readCell("I9", "I9");
                readCell("A7", "A7");
                readCell("B7", "B7");
                readCell("D10", "D10");
                readCell("E10", "E10");
            }, 5000);
        }
    </script>
</head>
<body onload="handleClientLoad()">
    <iframe class="weather-background" 
        src="https://embed.windy.com/embed2.html?lat=10.762622&lon=106.660172&zoom=5&level=surface&overlay=wind&menu=true&message=true&marker=true&calendar=now&pressure=true&type=map&location=coordinates&detail=true&detailLat=10.762622&detailLon=106.660172&metricWind=default&metricTemp=default&radarRange=-1">
    </iframe>

    <button class="toggle-btn" onclick="toggleTable()">H☰</button>
    
    <div class="container" id="dataTable">
        <table>
            <thead>
                <tr>
                    <th colspan="2" style="font-size: 18px; font-weight: bold; text-transform: uppercase; padding: 15px; background-color: #ffcc00; color: #333;">
                        NHIỆT ẨM KẾ ONLINE
                    </th>                    
                </tr>
                <tr>
                    <th>Thời gian:</th>
                    <th id="I9">Loading...</th>
                </tr>
                <tr>
                    <th>Nhiệt độ (℃)</th>
                    <th>Độ ẩm (%)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td id="A7">Loading...</td>
                    <td id="B7">Loading...</td>
                </tr>
                <tr>
                    <th>Min day (℃)</th>
                    <th>Max day (℃)</th>
                </tr>
                <tr>
                    <td id="D10">Loading...</td>
                    <td id="E10">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        function toggleTable() {
            document.getElementById("dataTable").classList.toggle("hidden");
        }
    </script>
</body>
</html>
